
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - voto-transparente

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      FLASK_APP: ${FLASK_APP}
      FLASK_DEBUG: ${FLASK_DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      NOTICIAS_USER_AGENT: ${NOTICIAS_USER_AGENT:-}
      NOTICIAS_HTTP_TIMEOUT: ${NOTICIAS_HTTP_TIMEOUT:-15}
      NOTICIAS_INTERVALO_MIN_SEGUNDOS: ${NOTICIAS_INTERVALO_MIN_SEGUNDOS:-900}
      NOTICIAS_RESUMO_MAX_CHARS: ${NOTICIAS_RESUMO_MAX_CHARS:-300}
      AGENCIA_BRASIL_EDITORIAS: ${AGENCIA_BRASIL_EDITORIAS:-politica,justica}
      CAMARA_USER_AGENT: ${CAMARA_USER_AGENT:-VotoTransparente/1.0 (projeto academico)}
      CAMARA_HTTP_TIMEOUT: ${CAMARA_HTTP_TIMEOUT:-20}
      CAMARA_INTERVALO_SEGUNDOS: ${CAMARA_INTERVALO_SEGUNDOS:-0.5}
      CAMARA_TENTATIVAS: ${CAMARA_TENTATIVAS:-3}
      CAMARA_ITENS_POR_PAGINA: ${CAMARA_ITENS_POR_PAGINA:-100}
      IMPORTAR_DADOS_DEMO: ${IMPORTAR_DADOS_DEMO:-1}
      DEMO_DATA_FILE: /database/seeds/demonstracao.json
      MIGRATIONS_DIR: /database/migrations
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend:/app
      - ./tests:/tests
      - ./database/migrations:/database/migrations:ro
      - ./database/seeds:/database/seeds:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - voto-transparente

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - voto-transparente

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  voto-transparente:
    driver: bridge
